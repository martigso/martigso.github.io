project:
  type: website
  output-dir: docs

website:
  title: "Martin Søyland"
  description: "Political scientist and postdoc at the University of Stavanger. Research, data, R packages, teaching material and op-eds."
  site-url: https://martigso.github.io/
  favicon: favicon.ico
  image: https://martigso.github.io/pictures/social_card.jpg   # link-preview card
  open-graph: true
  twitter-card: true
  page-navigation: false

  sidebar:
    title: "Home"
    style: floating
    search: false

    contents:
      - index.qmd

      - section: "Research"
        contents:
          - publications.qmd
          - conference.qmd
          - R.qmd
          - data.qmd

      - section: "Teaching"
        contents:
          - teaching.qmd

      - section: "Opinions"
        contents:
          - blog.qmd
    
    tools:
      
      # - icon: person-workspace
      #   menu:
      #     - text: UiO (nor)
      #       url: https://www.sv.uio.no/isv/personer/vit/martigso/
      #     - text: UiO (eng)
      #       url: https://www.sv.uio.no/isv/english/people/aca/martigso
        
      - icon: github
        text: GitHub
        href: https://github.com/martigso

      - icon: bluesky
        text: Bluesky
        href: https://bsky.app/profile/martigso.bsky.social

      - icon: mastodon
        text: Mastodon
        href: https://snabelen.no/@lufs
        rel: me   # lets Mastodon show this site as verified on the profile

      - icon: linkedin
        text: LinkedIn
        href: https://www.linkedin.com/in/martin-søyland-7817304b
format:
  html:
    email-obfuscation: javascript
    theme:
      dark: [darkly, style.scss]
      light: [flatly, style.scss]
    toc: true
    mainfont: expressway
    monofont: expressway
